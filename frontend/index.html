<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskTable</title>
    <link rel="stylesheet" href="style.css?v=17">
</head>
<body>
    <div class="container">
        <header>
            <h1>TaskTable</h1>
        </header>

        <div class="layout">
        <aside class="docs-sidebar" id="docs-sidebar">
            <div class="docs-header">
                <h2>Docs</h2>
                <button id="btn-new-topic" class="btn btn-small" title="Add a topic under a project">+ Topic</button>
                <button id="btn-new-doc" class="btn btn-small" title="Add a doc under a topic">+ Doc</button>
            </div>
            <div class="docs-filter">
                <input type="text" id="docs-tag-filter" placeholder="Filter by tag...">
                <button id="btn-clear-doc-filter" class="btn btn-small" title="Clear filter" style="display:none;">&times;</button>
            </div>
            <div id="docs-tree" class="docs-tree"></div>
        </aside>

        <div class="sidebar-resizer" id="sidebar-resizer" title="Drag to resize"></div>

        <main class="main-content">
        <section class="section" id="section-today">
            <h2>Today Needs to Handle</h2>
            <div class="search-bar" data-section="today">
                <input type="text" placeholder="Search content..." class="search-q">
                <input type="text" placeholder="Tag" class="search-tag">
                <select class="search-priority">
                    <option value="">Any Priority</option>
                    <option value="0">P0 Critical</option>
                    <option value="1">P1 High</option>
                    <option value="2">P2 Med-High</option>
                    <option value="3">P3 Medium</option>
                    <option value="4">P4 Low</option>
                    <option value="5">P5 Lowest</option>
                </select>
                <input type="date" class="search-from" title="From date">
                <input type="date" class="search-to" title="To date">
                <button class="btn btn-small btn-search">Search</button>
                <button class="btn btn-small btn-clear-search">Clear</button>
            </div>
            <div class="task-list" id="today-tasks"></div>
        </section>

        <section class="section" id="section-pending">
            <h2>Pending Tasks</h2>
            <div class="search-bar" data-section="pending">
                <input type="text" placeholder="Search content..." class="search-q">
                <input type="text" placeholder="Tag" class="search-tag">
                <select class="search-priority">
                    <option value="">Any Priority</option>
                    <option value="0">P0 Critical</option>
                    <option value="1">P1 High</option>
                    <option value="2">P2 Med-High</option>
                    <option value="3">P3 Medium</option>
                    <option value="4">P4 Low</option>
                    <option value="5">P5 Lowest</option>
                </select>
                <input type="date" class="search-from" title="From date">
                <input type="date" class="search-to" title="To date">
                <button class="btn btn-small btn-search">Search</button>
                <button class="btn btn-small btn-clear-search">Clear</button>
            </div>
            <div class="project-controls">
                <button id="btn-new-task" class="btn btn-primary">+ New Task</button>
                <button id="btn-new-project" class="btn btn-small">+ New Project</button>
                <button id="btn-delete-mode" class="btn btn-small btn-delete-mode">Delete Mode</button>
            </div>
            <div id="pending-tasks"></div>
        </section>

        <section class="section" id="section-done">
            <h2>Done Tasks</h2>
            <div class="search-bar" data-section="done">
                <input type="text" placeholder="Search content..." class="search-q">
                <input type="text" placeholder="Tag" class="search-tag">
                <select class="search-priority">
                    <option value="">Any Priority</option>
                    <option value="0">P0 Critical</option>
                    <option value="1">P1 High</option>
                    <option value="2">P2 Med-High</option>
                    <option value="3">P3 Medium</option>
                    <option value="4">P4 Low</option>
                    <option value="5">P5 Lowest</option>
                </select>
                <input type="date" class="search-from" title="From date">
                <input type="date" class="search-to" title="To date">
                <button class="btn btn-small btn-search">Search</button>
                <button class="btn btn-small btn-clear-search">Clear</button>
            </div>
            <button id="btn-summarize" class="btn btn-small btn-summarize">Summarize</button>
            <div id="done-summary" class="done-summary" style="display:none;"></div>
            <div id="done-tasks"></div>
        </section>
        </main>
        </div>
    </div>

    <!-- Task Modal (create/edit) -->
    <div class="modal" id="modal-task" style="display:none;">
        <div class="modal-content">
            <h3 id="modal-task-title">New Task</h3>
            <form id="form-task">
                <input type="hidden" id="task-edit-id">

                <label>Task Description</label>
                <textarea id="task-body" required placeholder="What needs to be done?"></textarea>

                <label>Project</label>
                <div class="project-select-row">
                    <select id="task-project"></select>
                    <button type="button" class="btn btn-small btn-delete-project" id="btn-delete-project" title="Delete the selected project">Delete Project</button>
                </div>

                <label>Priority (0 = highest, 5 = lowest)</label>
                <select id="task-priority">
                    <option value="0">0 - Critical</option>
                    <option value="1">1 - High</option>
                    <option value="2">2 - Medium-High</option>
                    <option value="3" selected>3 - Medium</option>
                    <option value="4">4 - Low</option>
                    <option value="5">5 - Lowest</option>
                </select>

                <label>Tags (comma-separated)</label>
                <input type="text" id="task-tags" placeholder="e.g. bug, frontend, urgent">

                <label>Related URLs</label>
                <div id="task-urls-container"></div>
                <button type="button" class="btn btn-small" id="btn-add-url">+ Add URL</button>

                <label>Follow-up Date</label>
                <input type="date" id="task-follow-up">

                <label>Due Date</label>
                <input type="date" id="task-due-date">

                <p class="hint">At least one of Follow-up Date or Due Date is required.</p>

                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" id="btn-cancel-task">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-submit-task">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- New Project Modal -->
    <div class="modal" id="modal-project" style="display:none;">
        <div class="modal-content">
            <h3>New Project</h3>
            <form id="form-project">
                <label>Project Name</label>
                <input type="text" id="project-name" required placeholder="Project name">
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" id="btn-cancel-project">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Project</button>
                </div>
            </form>
        </div>
    </div>

    <!-- New Topic Modal -->
    <div class="modal" id="modal-topic" style="display:none;">
        <div class="modal-content">
            <h3>New Doc Topic</h3>
            <form id="form-topic">
                <label>Project</label>
                <select id="topic-project"></select>
                <label>Topic Name</label>
                <input type="text" id="topic-name" required placeholder="e.g. design, api, onboarding">
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" id="btn-cancel-topic">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Topic</button>
                </div>
            </form>
        </div>
    </div>

    <!-- New Doc Modal -->
    <div class="modal" id="modal-doc" style="display:none;">
        <div class="modal-content">
            <h3 id="modal-doc-title">New Doc</h3>
            <form id="form-doc">
                <input type="hidden" id="doc-edit-id">
                <label>Project</label>
                <select id="doc-project"></select>
                <label>Topic</label>
                <select id="doc-topic"></select>
                <label>Doc Name</label>
                <input type="text" id="doc-name" required placeholder="Doc name">
                <label>URL</label>
                <input type="url" id="doc-url" required placeholder="https://...">
                <label>Tags (comma-separated)</label>
                <input type="text" id="doc-tags" placeholder="e.g. design, api, runbook">
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" id="btn-cancel-doc">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-submit-doc">Add Doc</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Reopen Task Modal -->
    <div class="modal" id="modal-reopen" style="display:none;">
        <div class="modal-content">
            <h3>Reopen Task</h3>
            <form id="form-reopen">
                <input type="hidden" id="reopen-task-id">
                <label>Follow-up Date</label>
                <input type="date" id="reopen-follow-up">
                <label>Due Date</label>
                <input type="date" id="reopen-due-date">
                <p class="hint">At least one date required to reopen.</p>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" id="btn-cancel-reopen">Cancel</button>
                    <button type="submit" class="btn btn-primary">Reopen</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js?v=23"></script>
</body>
</html>
